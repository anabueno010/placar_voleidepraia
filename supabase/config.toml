# Supabase CLI project configuration.
# The project reference is linked locally by `supabase link` and should not be
# committed as a credential.

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = false

[realtime]
enabled = true

